name: Générer un article IA et Commenter
on:
  pull_request:
    types: [opened, synchronize]
    branches: 
      - main

permissions:
  contents: write
  issues: write
  pull-requests: write

jobs: 
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}

      - name: Install dépendances
        run: npm install

      - name: Générer l'article avec la clé d'OpenAI
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: node scripts/generate-article.js

      - name: Ajouter un commentaire sur la PR
        uses: actions/github-script@v6
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: " **Nouvel Article généré par IA !**\n\n **Titre de l'article :** ${{ env.ARTICLE_TITLE }}\n\n **Résumé :** ${{ env.ARTICLE_SUMMARY }}"
            })

      - name: Commit et push de l'article généré
        run: |
          git config --global user.name "github-actions"
          git config --global user.email "actions@github.com"
          git add blog/
          git commit -m "Mise à jour de l'article généré" || echo "Aucun changement à commit"
          git pull --rebase origin ${{ github.head_ref }} 
          git push origin HEAD:${{ github.head_ref }}     

      - name: Sauvegarder l'article en artefact
        uses: actions/upload-artifact@v4
        with:
          name: article généré
          path: blog/